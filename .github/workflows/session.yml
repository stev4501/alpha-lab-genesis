name: research-session

# Manual trigger only for now. The schedule below is intentionally absent:
# per ADR-0008, a human enables it only after the first workflow_dispatch
# runs prove the loop end to end.
on:
  workflow_dispatch: {}

concurrency:
  group: research-session      # never two sessions at once
  cancel-in-progress: false

permissions:
  contents: write         # push the session branch (never main, since BL-0005)
  pull-requests: write    # gh pr create in loop/run_session.sh

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 110       # runner-level backstop above SESSION_MINUTES
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 is required: validate_session.sh diffs against
          # main and verifies sealed hashes against the pre-mvp-freeze tag.
          # Read the note on SESSION_PR_TOKEN below before assuming the
          # default GITHUB_TOKEN is enough here.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pytest jsonschema
          npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name  "alpha-lab-agent"
          git config user.email "agent@users.noreply.github.com"

      - name: Run session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Which token opens the session pull request decides whether the
          # required check can ever run. GitHub does not trigger workflows
          # from events created with the default GITHUB_TOKEN, so a pull
          # request opened with it gets NO pull_request run, and a required
          # session-validate check would sit pending forever.
          #
          # Set SESSION_PR_TOKEN to a GitHub App installation token (or a
          # machine-account fine-grained PAT with contents:write and
          # pull-requests:write) before enabling the required check. Its
          # author must not be the human reviewer: GitHub forbids a pull
          # request's author from supplying its own approving review.
          #
          # Until that secret exists this falls back to GITHUB_TOKEN, which
          # opens pull requests fine — it just cannot trigger the check. That
          # fallback also needs Settings > Actions > General > "Allow GitHub
          # Actions to create and approve pull requests" enabled.
          GH_TOKEN: ${{ secrets.SESSION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          SESSION_MINUTES: "90"
          MAX_BUDGET_USD: "5"
        run: bash loop/run_session.sh

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-logs-${{ github.run_id }}
          path: logs/loop/
          retention-days: 30
